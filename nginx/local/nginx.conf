load_module modules/ngx_http_geoip2_module.so;

user  nginx;
worker_processes  auto;

error_log  /home/app/backend/logs/nginx-error.log warn;
pid        /var/run/nginx.pid;
# Old workers would otherwise hold WebSockets open for days after a reload.
worker_shutdown_timeout 30s;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format  json_analytics escape=json '{'
                            '"time_iso8601": "$time_iso8601", '
                            '"remote_addr": "$remote_addr", '
                            '"request": "$request", '
                            '"request_uri": "$request_uri", '
                            '"status": "$status", '
                            '"body_bytes_sent": "$body_bytes_sent", '
                            '"request_method": "$request_method", '
                            '"request_time": "$request_time", '
                            '"http_referer": "$http_referer", '
                            '"http_user_agent": "$http_user_agent", '
                            '"upstream": "$upstream_addr", '
                            '"upstream_response_time": "$upstream_response_time", '
                            '"http_host": "$http_host", '
                            '"server_name": "$server_name", '
                            '"geoip_country_code": "$geoip2_country_code", '
                            '"geoip_city": "$geoip2_city", '
                            '"geoip_lat": "$geoip2_lat", '
                            '"geoip_lon": "$geoip2_lon"'
                            '}';

    access_log  /home/app/backend/logs/nginx-json-access.log json_analytics;

    # Single mmdb covers IPv4 + IPv6. No enforcement here, LAN sources have no country.
    geoip2 /etc/nginx/geoip/GeoLite2-City.mmdb {
        auto_reload 6h;
        $geoip2_country_code source=$remote_addr country iso_code;
        $geoip2_city         source=$remote_addr default=unknown city names en;
        $geoip2_lat          source=$remote_addr location latitude;
        $geoip2_lon          source=$remote_addr location longitude;
    }

    include /etc/nginx/geo-block.conf;

    # Maintenance switch, see README.deploy.md. Bypass entries take effect on reload.
    geo $maintenance_bypass {
        default 0;
        include /etc/nginx/maintenance/bypass*.conf;
    }

    # Static files stay reachable, else an open tab cannot even draw the maintenance notice.
    map $uri $maintenance_exempt {
        default                                     0;
        ~^/\.well-known/acme-challenge/             1;
        ~^/__errors/                                1;
        ~^/assets/                                  1;
        ~\.(svg|png|ico|webp|woff2?|webmanifest)$   1;
    }

    sendfile on;
    client_max_body_size 100M;

    keepalive_timeout  65;

    # Gzip configuration
    gzip_static on;
    gzip on;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 0;
    gzip_types text/plain application/javascript text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype;

    map $http_upgrade $connection_upgrade {
        default Upgrade;
        '' close;
    }

    # No proxy in front, so $remote_addr is the real client IP.
    # IPv6 clients rotate freely inside their prefix, so group them by /64.
    map $remote_addr $limit_key {
        default                                       $binary_remote_addr;
        "~^(?<v6_prefix>(?:[0-9a-fA-F]{0,4}:){1,4})"  $v6_prefix;
    }

    limit_req_zone $limit_key zone=api:10m rate=20r/s;
    limit_req_zone $limit_key zone=grafana:10m rate=30r/s;

    # Empty key makes limit_req skip the request.
    map $request_method $gf_login_key {
        POST    $limit_key;
        default "";
    }
    limit_req_zone $gf_login_key zone=grafana_login:10m rate=20r/m;

    map $request_method $admin_login_key {
        POST    $limit_key;
        default "";
    }
    limit_req_zone $admin_login_key zone=admin_login:10m rate=20r/m;

    limit_req_status 429;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        server_tokens off;

        include /etc/nginx/errors/errors-html.conf;
        include /etc/nginx/errors/errors-location.conf;

        # Runtime DNS so nginx starts without its upstreams and follows recreated containers.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend_upstream http://frontend:8080;
        set $backend_upstream http://backend:8000;
        set $websockets_upstream http://websockets:9000;

        # The page itself is the switch, so turning it on or off needs no reload.
        set $maintenance "";
        if (-f /etc/nginx/maintenance/index.html) {
            set $maintenance "on";
        }
        set $maintenance "$maintenance$maintenance_bypass$maintenance_exempt";
        if ($maintenance = "on00") {
            return 599;
        }
        error_page 599 =503 @maintenance;

        location / {
            proxy_intercept_errors on;
            # Only the backend may hand out protected media.
            proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;
            proxy_set_header Host $host;
            proxy_pass $frontend_upstream;
        }

        location /api/static/ {
            include /etc/nginx/errors/errors-json.conf;
            alias /home/app/backend/staticfiles/;
        }

        location /api/media/protected/frame-updates/ {
            internal;
            include /etc/nginx/errors/errors-json.conf;
            alias /home/app/backend/mediafiles/frame-updates/;
        }

        location /api/media/protected/changelogs/ {
            internal;
            include /etc/nginx/errors/errors-json.conf;
            alias /home/app/backend/mediafiles/changelogs/;
        }

        location /api/media/protected/private/ {
            internal;
            include /etc/nginx/errors/errors-json.conf;
            alias /home/app/backend/mediafiles/private/;
        }

        location /api/media/protected/avatars/ {
            internal;
            include /etc/nginx/errors/errors-json.conf;
            alias /home/app/backend/mediafiles/avatars/;
        }

        location /api/media/protected/frame-diagnostics/ {
            internal;
            include /etc/nginx/errors/errors-json.conf;
            alias /home/app/backend/mediafiles/frame-diagnostics/;
        }

        location /api/media/protected/server_logs/ {
            internal;
            include /etc/nginx/errors/errors-json.conf;
            alias /home/app/backend/mediafiles/server_logs/;
        }

        location /api/ {
            include /etc/nginx/errors/errors-json.conf;
            limit_req zone=api burst=60 nodelay;
            try_files $uri @proxy_api;
        }

        location = /api/admin/login/ {
            include /etc/nginx/errors/errors-json.conf;
            limit_req zone=admin_login burst=10 nodelay;
            limit_req zone=api burst=60 nodelay;
            try_files $uri @proxy_api;
        }

        location /ws/ {
            include /etc/nginx/errors/errors-json.conf;
            try_files $uri @proxy_websocket;
        }

        location @proxy_websocket {
            gzip off;
            chunked_transfer_encoding off;
            keepalive_timeout 0;

            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Frame-Options SAMEORIGIN;
            proxy_set_header   X-Forwarded-Host $server_name;
            proxy_set_header   X-Real-IP $remote_addr;

            proxy_buffering off;
            proxy_cache off;
            proxy_cache_bypass $http_upgrade;

            include /etc/nginx/errors/errors-upstream.conf;
            proxy_pass $websockets_upstream;
        }

        location @maintenance {
            default_type application/json;
            if ($uri ~ ^/(api|ws)/) {
                return 503 '{"detail":"Service temporarily unavailable.","maintenance":true}\n';
            }
            root /etc/nginx/maintenance;
            try_files /index.html =503;
        }

        location @proxy_api {
            include /etc/nginx/errors/errors-upstream.conf;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_pass $backend_upstream;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name monitoring.localhost;
        server_tokens off;

        include /etc/nginx/errors/errors-html.conf;
        include /etc/nginx/errors/errors-location.conf;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        # Runtime DNS so nginx starts before grafana.
        resolver 127.0.0.11 valid=30s;
        set $grafana_upstream http://grafana:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # No add_header here, it would drop the inherited X-Robots-Tag.
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # Unauthenticated, reports the Grafana version.
        location = /api/health {
            return 404;
        }

        location = /login {
            limit_req zone=grafana_login burst=10 nodelay;
            proxy_pass $grafana_upstream;
        }

        location / {
            # Burst covers a full dashboard page load.
            limit_req zone=grafana burst=100 nodelay;
            proxy_pass $grafana_upstream;
        }
    }
}
