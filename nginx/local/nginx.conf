load_module modules/ngx_http_geoip_module.so;
load_module modules/ngx_stream_geoip_module.so;

user  nginx;
worker_processes  auto;

error_log  /home/app/backend/logs/nginx-error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format  json_analytics escape=json '{'
                            '"time_iso8601": "$time_iso8601", '
                            '"remote_addr": "$remote_addr", '
                            '"request": "$request", '
                            '"request_uri": "$request_uri", '
                            '"status": "$status", '
                            '"body_bytes_sent": "$body_bytes_sent", '
                            '"request_method": "$request_method", '
                            '"request_time": "$request_time", '
                            '"http_referer": "$http_referer", '
                            '"http_user_agent": "$http_user_agent", '
                            '"upstream": "$upstream_addr", '
                            '"upstream_response_time": "$upstream_response_time", '
                            '"server_name": "$server_name", '
                            '"geoip_country_code": "$geoip_country_code"'
                            '}';

    access_log  /home/app/backend/logs/nginx-json-access.log json_analytics;

    geoip_country /etc/nginx/GeoIP.dat;
    geoip_city /etc/nginx/GeoIPCity.dat;

    sendfile on;
    client_max_body_size 100M;

    keepalive_timeout  65;

    # Gzip configuration
    gzip_static on;
    gzip on;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 0;
    gzip_types text/plain application/javascript text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype;

    map $http_upgrade $connection_upgrade {
        default Upgrade;
        '' close;
    }

    # No proxy in front, so $binary_remote_addr is the real client IP.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=grafana:10m rate=30r/s;

    # Empty key makes limit_req skip the request.
    map $request_method $gf_login_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $gf_login_key zone=grafana_login:10m rate=20r/m;

    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;
        server_tokens off;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html =404;
        }

        location /api/static/ {
            alias /home/app/backend/staticfiles/;
        }

        location /api/media/protected/frame-updates/ {
            internal;
            alias /home/app/backend/mediafiles/frame-updates/;
        }

        location /api/media/protected/changelogs/ {
            internal;
            alias /home/app/backend/mediafiles/changelogs/;
        }

        location /api/media/protected/private/ {
            internal;
            alias /home/app/backend/mediafiles/private/;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            try_files $uri @proxy_api;
        }

        location /ws/ {
            try_files $uri @proxy_websocket;
        }

        location @proxy_websocket {
            gzip off;
            chunked_transfer_encoding off;
            keepalive_timeout 0;

            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Frame-Options SAMEORIGIN;
            proxy_set_header   X-Forwarded-Host $server_name;
            proxy_set_header   X-Real-IP $remote_addr;

            proxy_buffering off;
            proxy_cache off;
            proxy_cache_bypass $http_upgrade;

            proxy_pass http://websockets:9000;
        }

        location @proxy_api {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_pass http://backend:8000;
        }
    }

    server {
        listen 80;
        server_name monitoring.localhost;
        server_tokens off;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        # Runtime DNS so nginx starts before grafana.
        resolver 127.0.0.11 valid=30s;
        set $grafana_upstream http://grafana:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # No add_header here, it would drop the inherited X-Robots-Tag.
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        location = /login {
            limit_req zone=grafana_login burst=10 nodelay;
            proxy_pass $grafana_upstream;
        }

        location / {
            # Burst covers a full dashboard page load.
            limit_req zone=grafana burst=100 nodelay;
            proxy_pass $grafana_upstream;
        }
    }
}
