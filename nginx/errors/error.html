  margin: 0; min-height: 100vh; padding: 0 16px;

svg { width: 100%; max-width: 300px; height: auto; }
@media (max-width: 600px) { svg { max-width: 150px; } }

a {
  margin-top: 8px; padding: 6px 16px; border-radius: 10px;
  background: var(--primary); color: #fff; text-decoration: none;
  font-size: 0.875rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em;
