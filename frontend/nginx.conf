server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;
    access_log off;

    root /usr/share/nginx/html;

    # Serves the .gz files from the build instead of compressing per request.
    gzip_static on;
    gzip_vary on;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed names, so a chunk gone after a deploy must 404 instead of getting index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
