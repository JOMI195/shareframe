global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Each scrape runs a DB pass, so keep it infrequent.
  - job_name: django
    metrics_path: /metrics
    scrape_interval: 60s
    static_configs:
      - targets: ["backend:8000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: telegraf
    scrape_interval: 30s
    static_configs:
      - targets: ["telegraf:9273"]
