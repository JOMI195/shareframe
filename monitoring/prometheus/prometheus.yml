global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: django
    metrics_path: /metrics
    scrape_interval: 60s
    static_configs:
      - targets: ["backend:8000"]

  # Each scrape walks every image variant on disk, so keep it infrequent.
  # Stay under Prometheus' 5m lookback delta or the host dashboard gaps.
  - job_name: django-business
    metrics_path: /metrics/business
    scrape_interval: 240s
    static_configs:
      - targets: ["backend:8000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: telegraf
    scrape_interval: 30s
    static_configs:
      - targets: ["telegraf:9273"]
