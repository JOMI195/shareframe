apiVersion: 1

groups:
  - orgId: 1
    name: security
    folder: ShareFrame
    interval: 1m
    rules:
      - uid: shareframe_grafana_login
        title: GrafanaLogin
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: info
        annotations:
          summary: 'Grafana login: userID {{ $labels.userID }} from {{ $labels.clientIP }} ({{ $labels.userAgent }})'
          __dashboardUid__: shareframe-auth
          __panelId__: "26"
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum by (userID, clientIP, userAgent) (count_over_time({job="grafana", logger="auth"} |= "User auth token created" | logfmt [1m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Grafana's failure line carries no client address, nginx does.
      - uid: shareframe_grafana_failed_logins
        title: GrafanaFailedLogins
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.ip }} ({{ $labels.country }}): {{ $values.A.Value }} of {{ $values.T.Value }} failed Grafana logins in 5m'
          __dashboardUid__: shareframe-auth
          __panelId__: "25"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'topk(5, sum by (ip, country) (count_over_time({job="nginx", logtype="access", request_method="POST", status="401"} |= `"request_uri": "/login"` | json ip="remote_addr" [5m])))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: T
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: T
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum (count_over_time({job="nginx", logtype="access", request_method="POST", status="401"} |= `"request_uri": "/login"` [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: math
              expression: '$A * ($T > 3)'

      - uid: shareframe_host_ssh_login
        title: HostSshLogin
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: info
        annotations:
          summary: 'SSH login: {{ $labels.user }} from {{ $labels.ip }}'
          __dashboardUid__: shareframe-auth
          __panelId__: "35"
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum by (user, ip) (count_over_time({job="host", program=~"sshd(-session)?"} |~ `Accepted \S+ for \S+ from \S+` | regexp `Accepted \S+ for (?P<user>\S+) from (?P<ip>\S+)` [1m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: shareframe_host_ssh_bruteforce
        title: HostSshBruteForce
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.ip }}: {{ $values.A.Value }} of {{ $values.T.Value }} failed SSH logins in 5m'
          __dashboardUid__: shareframe-auth
          __panelId__: "29"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'topk(5, sum by (ip) (count_over_time({job="host", program=~"sshd(-session)?"} |~ "Failed password|Invalid user|authentication failure" | regexp `(?:from |rhost=)(?P<ip>[0-9a-fA-F.:]+)` [5m])))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: T
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: T
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum (count_over_time({job="host", program=~"sshd(-session)?"} |~ "Failed password|Invalid user|authentication failure" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: math
              expression: '$A * ($T > 200)'

      - uid: shareframe_host_account_change
        title: HostAccountChange
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: 'Host account change via {{ $labels.program }}: {{ $labels.detail }}'
          __dashboardUid__: shareframe-auth
          __panelId__: "35"
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum by (program, detail) (count_over_time({job="host", program=~"useradd|userdel|usermod|groupadd|gpasswd|passwd|chpasswd"} | regexp `(?:useradd|userdel|usermod|groupadd|gpasswd|passwd|chpasswd)(?:\[\d+\])?: (?P<detail>.{1,120})` [1m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Only sudo's own lines; pam logs the same failure again without the command.
      - uid: shareframe_host_sudo_failure
        title: HostSudoFailure
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: 'Failed sudo by {{ $labels.user }}{{ with $labels.command }} running {{ . }}{{ end }}'
          __dashboardUid__: shareframe-auth
          __panelId__: "35"
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum by (user, command) (count_over_time({job="host", program="sudo"} |~ "incorrect password attempt|NOT in sudoers" | regexp `sudo(?:\[\d+\])?: +(?P<user>\S+) : ` | regexp `COMMAND=(?P<command>.{1,80})` [1m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: shareframe_app_failed_login_burst
        title: AppFailedLoginBurst
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.ip }} as ''{{ $labels.account }}'' via {{ $labels.channel }}: {{ $values.A.Value }} of {{ $values.T.Value }} failed app logins in 5m'
          __dashboardUid__: shareframe-auth
          __panelId__: "11"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'topk(5, sum by (ip, account, channel) (count_over_time({job="backend", logger="admin.audit"} |= "Failed login attempt" | regexp `Failed login attempt for ''(?P<account>[^'']{0,64})[^'']*'' from (?P<ip>\S+) via (?P<channel>\S+)` [5m])))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: T
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: T
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum (count_over_time({job="backend", logger="admin.audit"} |= "Failed login attempt" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: math
              expression: '$A * ($T > 10)'

      - uid: shareframe_app_csrf_failures
        title: AppCsrfFailures
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.ip }} {{ $labels.method }} {{ $labels.path }} ({{ $labels.reason }}): {{ $values.A.Value }} of {{ $values.T.Value }} CSRF failures in 5m'
          __dashboardUid__: shareframe-auth
          __panelId__: "18"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'topk(5, sum by (ip, method, path, reason) (count_over_time({job="backend", logger="django.security.csrf"} |= "CSRF failed" | regexp `CSRF failed on (?P<method>\S+) (?P<path>\S{1,64})\S* from (?P<ip>\S+): (?P<reason>.{0,64})` [5m])))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: T
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: T
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum (count_over_time({job="backend", logger="django.security.csrf"} |= "CSRF failed" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: math
              expression: '$A * ($T > 5)'

      - uid: shareframe_app_account_change
        title: AppAccountChange
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: info
        annotations:
          summary: '{{ $labels.event }} for {{ $labels.email }}{{ with $labels.new_email }} (now {{ . }}){{ end }} from {{ $labels.ip }}'
          __dashboardUid__: shareframe-auth
          __panelId__: "23"
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum by (event, email, new_email, ip) (count_over_time({job="backend", logger="admin.audit"} |~ " - (Account deleted|Email changed|Password changed|Password reset): " | regexp " - (?P<event>Account deleted|Email changed|Password changed|Password reset): (?P<email>\\S+)(?: to (?P<new_email>\\S+))? from (?P<ip>\\S+)" [1m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: shareframe_app_otp_rejected_burst
        title: AppOtpRejectedBurst
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: 'Frame {{ $labels.serial }}: {{ $values.A.Value }} rejected OTPs in 5m'
          __dashboardUid__: shareframe-auth
          __panelId__: "31"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum by (serial) (count_over_time({job="backend", logger="admin.audit"} |= "OTP rejected for frame" | regexp "OTP rejected for frame (?P<serial>\\S+)" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

      - uid: shareframe_nginx_rate_limited
        title: NginxRateLimited
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.ip }} ({{ $labels.country }}) {{ $labels.path }} by {{ $labels.limiter }}: {{ $values.A.Value }} of {{ $values.T.Value }} rate-limited requests in 5m'
          __dashboardUid__: shareframe-logs-nginx
          __panelId__: "1"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'topk(5, sum by (ip, country, path, limiter) (count_over_time({job="nginx", logtype="access", status="429"} | json ip="remote_addr", upstream="upstream" | regexp `"request_uri": "(?P<path>[^?"]{0,64})` | label_format limiter=`{{ if .upstream }}backend{{ else }}nginx{{ end }}` [5m])))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: T
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: T
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum (count_over_time({job="nginx", logtype="access", status="429"} [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: math
              expression: '$A * ($T > 50)'

      - uid: shareframe_nginx_auth_errors_spike
        title: NginxAuthErrorsSpike
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.ip }} ({{ $labels.country }}) {{ $labels.status }} on {{ $labels.path }}: {{ $values.A.Value }} of {{ $values.T.Value }} backend 401/403 responses in 5m'
          __dashboardUid__: shareframe-logs-nginx
          __panelId__: "1"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'topk(5, sum by (ip, country, path, status) (count_over_time({job="nginx", logtype="access", status=~"401|403"} | json ip="remote_addr", upstream="upstream" | upstream != "" | regexp `"request_uri": "(?P<path>[^?"]{0,64})` [5m])))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: T
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: T
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum (count_over_time({job="nginx", logtype="access", status=~"401|403"} | json upstream="upstream" | upstream != "" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: math
              expression: '$A * ($T > 100)'

      - uid: shareframe_nginx_egress_spike
        title: NginxEgressSpike
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.remote_addr }} ({{ $labels.country }}) downloaded {{ humanize1024 $values.A.Value }}B in 5m'
          __dashboardUid__: shareframe-logs-nginx
          __panelId__: "108"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum by (remote_addr, country) (sum_over_time({job="nginx", logtype="access"} | json remote_addr="remote_addr", bytes="body_bytes_sent" | unwrap bytes | __error__="" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    # 500 MiB
                    params: [524288000]

  - orgId: 1
    name: platform
    folder: ShareFrame
    interval: 1m
    rules:
      # Always firing while promtail -> Loki -> Grafana works (Grafana logs its
      # own rule queries); routed to the external heartbeat, which mails when the
      # pings stop. NoData/Error must stay OK, or a broken pipeline still pings.
      - uid: shareframe_pipeline_heartbeat
        title: PipelineHeartbeat
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          heartbeat: "true"
        annotations:
          summary: 'Monitoring pipeline alive'
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: instant
              expr: 'sum (count_over_time({job="grafana"} [15m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: shareframe_backend_metrics_down
        title: BackendMetricsDown
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'Backend /metrics target {{ with $labels.instance }}{{ . }} {{ end }}is down'
          __dashboardUid__: shareframe-overview
          __panelId__: "1"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'up{job="django"}'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: shareframe_target_down
        title: TargetDown
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Scrape target {{ $labels.job }} ({{ $labels.instance }}) is down'
          __dashboardUid__: shareframe-overview
          __panelId__: "16"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'up{job!="django"}'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: shareframe_host_disk_almost_full
        title: HostDiskAlmostFull
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Disk {{ $labels.mountpoint }} at {{ printf "%.0f" $values.A.Value }}%, {{ humanize1024 $values.F.Value }}B free'
          __dashboardUid__: shareframe-host
          __panelId__: "7"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: '(1 - (node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs", mountpoint!~"/(run|var/lib/docker)(/.*)?"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs|zfs", mountpoint!~"/(run|var/lib/docker)(/.*)?"})) * 100'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: F
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: F
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs", mountpoint!~"/(run|var/lib/docker)(/.*)?"} + 0'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [75]

      - uid: shareframe_host_memory_almost_full
        title: HostMemoryAlmostFull
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
