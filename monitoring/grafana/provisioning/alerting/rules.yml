                uid: loki
              editorMode: code
              queryType: range
              expr: 'sum by (program) (count_over_time({job="host", program=~"useradd|userdel|usermod|groupadd|gpasswd|passwd|chpasswd"} [1m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              reducer: last
              expression: A
          - refId: C
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
