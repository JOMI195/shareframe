              conditions:
                - evaluator:
                    type: gt
                    params: [5]

      - uid: shareframe_app_account_change
        title: AppAccountChange
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          severity: info
        annotations:
          summary: 'App account change: {{ $labels.event }} for {{ $labels.email }}'
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              expr: 'sum by (event, email) (count_over_time({job="backend", logger="admin.audit"} |~ " - (Account deleted|Email changed|Password changed|Password reset): " | regexp " - (?P<event>Account deleted|Email changed|Password changed|Password reset): (?P<email>\\S+)" [1m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
