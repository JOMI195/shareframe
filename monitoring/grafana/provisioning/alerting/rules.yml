        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Frame {{ $labels.serial_number }} reports health {{ $labels.status }}'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'shareframe_frame_health{check="overall", status!="ok"}'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: shareframe_frame_service_down
        title: FrameServiceDown
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Frame {{ $labels.serial_number }}: service {{ $labels.service }} not running'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              # Safe mode keeps the display down on purpose; FrameSafeMode covers it.
              expr: 'shareframe_frame_service_running{service=~"websocket|display|dashboard|update"} unless on (serial_number, service) label_replace(shareframe_frame_safe_mode == 1, "service", "display", "", "")'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
      - uid: shareframe_frame_reboot_loop
        title: FrameRebootLoop
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Frame {{ $labels.serial_number }} booted 3+ times within an hour'
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'max_over_time(shareframe_frame_boot_count[1h]) - min_over_time(shareframe_frame_boot_count[1h])'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
      - uid: shareframe_frame_crashing
        title: FrameCrashing
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Frame {{ $labels.serial_number }} had 3+ app crashes within an hour'
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'max_over_time(shareframe_frame_crash_count[1h]) - min_over_time(shareframe_frame_crash_count[1h])'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
      - uid: shareframe_frame_display_failed
        title: FrameDisplayFailed
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Frame {{ $labels.serial_number }} display failed 3+ refreshes in a row'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'shareframe_frame_health{check="display", status="failed"}'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: shareframe_frame_safe_mode
        title: FrameSafeMode
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Frame {{ $labels.serial_number }} display in safe mode ({{ $labels.reason }}); stays off until exit_safe_mode or a reboot'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              # A remote safe mode was set by an admin on purpose.
              expr: 'shareframe_frame_safe_mode{reason!="remote"}'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
