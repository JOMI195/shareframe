                uid: loki
              editorMode: code
              queryType: range
              expr: 'sum (count_over_time({job="host", program="sudo"} |~ "authentication failure|incorrect password|NOT in sudoers" [1m]))'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
