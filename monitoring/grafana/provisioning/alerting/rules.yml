  # Telemetry is only exported for frames that heartbeat, so silence is never an
  # alert: owners switch frames off, go on vacation or pull the plug.
  - orgId: 1
    name: frames
    folder: ShareFrame
    interval: 1m
    rules:
      - uid: shareframe_frame_unhealthy
        title: FrameUnhealthy
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Frame {{ $labels.serial_number }}{{ with $labels.owner_email }} ({{ . }}){{ end }} reports health {{ $labels.status }}'
          __dashboardUid__: shareframe-frames
          __panelId__: "47"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              # Owner joined from the last hour of the roster, so a backend scrape gap keeps it;
              # frames missing from the roster still alert, without owner.
              expr: '(shareframe_frame_health{check="overall", status!="ok"}) * on (serial_number) group_left (owner_email) topk by (serial_number) (1, max by (serial_number, owner_email) (last_over_time(shareframe_frame_info[1h]))) or on (serial_number) (shareframe_frame_health{check="overall", status!="ok"})'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: shareframe_frame_service_down
        title: FrameServiceDown
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Frame {{ $labels.serial_number }}{{ with $labels.owner_email }} ({{ . }}){{ end }}: service {{ $labels.service }} not running'
          __dashboardUid__: shareframe-frames
          __panelId__: "47"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              # Safe mode keeps the display down on purpose; FrameSafeMode covers it.
              expr: '(shareframe_frame_service_running{service=~"websocket|display|dashboard|update"} unless on (serial_number, service) label_replace(shareframe_frame_safe_mode == 1, "service", "display", "", "")) * on (serial_number) group_left (owner_email) topk by (serial_number) (1, max by (serial_number, owner_email) (last_over_time(shareframe_frame_info[1h]))) or on (serial_number, service) (shareframe_frame_service_running{service=~"websocket|display|dashboard|update"} unless on (serial_number, service) label_replace(shareframe_frame_safe_mode == 1, "service", "display", "", ""))'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: shareframe_frame_reboot_loop
        title: FrameRebootLoop
        condition: C
        for: 0s
        keepFiringFor: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Frame {{ $labels.serial_number }}{{ with $labels.owner_email }} ({{ . }}){{ end }} booted {{ printf "%.0f" $values.A.Value }}x within an hour'
          __dashboardUid__: shareframe-frames
          __panelId__: "16"
