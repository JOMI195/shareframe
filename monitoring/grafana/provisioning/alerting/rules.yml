              editorMode: code
              expr: '(max_over_time(shareframe_frame_boot_count[1h]) - min_over_time(shareframe_frame_boot_count[1h])) * on (serial_number) group_left (owner_email) topk by (serial_number) (1, max by (serial_number, owner_email) (last_over_time(shareframe_frame_info[1h]))) or on (serial_number) (max_over_time(shareframe_frame_boot_count[1h]) - min_over_time(shareframe_frame_boot_count[1h]))'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
