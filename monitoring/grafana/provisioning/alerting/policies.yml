apiVersion: 1

# Replaces the default tree, whose root receiver is Grafana's example address.
policies:
  - orgId: 1
    receiver: shareframe-admin
    group_by: [grafana_folder, alertname, userID, clientIP, container_name, serial_number, task, job]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
