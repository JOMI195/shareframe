apiVersion: 1

# Replaces the default tree, whose root receiver is Grafana's example address.
policies:
  - orgId: 1
    receiver: shareframe-admin
    group_by: [grafana_folder, alertname]
    group_wait: 1m
    group_interval: 10m
    repeat_interval: 4h
    routes:
      - receiver: heartbeat
        object_matchers:
          - ["heartbeat", "=", "true"]
        group_by: [alertname]
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 5m
