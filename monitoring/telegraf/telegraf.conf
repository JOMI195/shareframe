# Container health from the Docker API. cAdvisor cannot be used: it reads the
# classic image store layout, which the containerd snapshotter no longer has.

[agent]
  interval = "30s"
  flush_interval = "30s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  source_tag = false
  timeout = "5s"
  perdevice_include = []
  total_include = ["cpu", "network", "blkio"]
  docker_label_exclude = ["*"]
  tagexclude = ["container_id", "container_version", "container_image", "engine_host", "server_version", "cpu"]
  # whitelist, so anything not listed here never reaches the processors below.
  # health_status is a string field; the prometheus output turns it into a label.
  fieldinclude = ["usage_percent", "usage", "limit", "rx_bytes", "tx_bytes", "uptime_ns", "restart_count", "exitcode", "oomkilled", "failing_streak", "health_status", "io_service_bytes_recursive_read", "io_service_bytes_recursive_write", "n_containers", "n_containers_running", "n_containers_stopped", "n_images"]

# Mirror the health_status label onto a numeric field. Grafana drops string
# columns from every frame but the first when joining, so the table can only
# show health as a value; this also makes it usable in alerts and timelines.
[[processors.enum]]
  namepass = ["docker_container_health"]
  [[processors.enum.mapping]]
    fields = ["health_status"]
    dest = "state"
    default = 0
    [processors.enum.mapping.value_mappings]
      healthy = 1
      starting = 2
      unhealthy = 3

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  collectors_exclude = ["gocollector", "process"]
