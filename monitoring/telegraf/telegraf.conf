# Container health from the Docker API. cAdvisor cannot be used: it reads the
# classic image store layout, which the containerd snapshotter no longer has.

[agent]
  interval = "30s"
  flush_interval = "30s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  source_tag = false
  timeout = "5s"
  perdevice_include = []
  total_include = ["cpu", "network"]
  docker_label_exclude = ["*"]
  tagexclude = ["container_id", "container_version", "container_image", "engine_host", "server_version", "cpu"]
  # health_status is a string field, not a tag; the prometheus output turns it into a label
  fieldinclude = ["usage_percent", "usage", "limit", "rx_bytes", "tx_bytes", "uptime_ns", "restart_count", "exitcode", "oomkilled", "failing_streak", "health_status", "n_containers", "n_containers_running", "n_containers_stopped", "n_images"]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  collectors_exclude = ["gocollector", "process"]
