server:
  http_listen_port: 9080

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Dev has no logs_volume and no nginx: every container ships from stdout,
  # relabelled to the same job/level/logger the prod config produces.
  - job_name: docker
    # The socket lists every stack on the host; only this project's containers ship.
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=${COMPOSE_PROJECT}"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["container"]
        regex: ".*"
        target_label: job
        replacement: docker
      - source_labels: ["container"]
        regex: "(backend|websockets|celery|celery-beat)"
        target_label: job
        replacement: backend
      - source_labels: ["container"]
        regex: "grafana"
        target_label: job
        replacement: grafana
    pipeline_stages:
      # Link tokens in request paths must not reach Loki.
      - replace:
          expression: '(?:/auth/users/(?:activate|password-reset)/[^/\s"]+/|/auth/users/email-change/|/benachrichtigungen/abmelden/|[?&]token=)([^/?&\s"]+)'
          replace: 'REDACTED'
      - match:
          selector: '{job="backend"}'
          stages:
            - regex:
                expression: '^(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d+) \[(?P<level>\w+)\] (?P<logger>\S+) - (?P<func>\S+) - (?P<message>.*)$'
            - labels:
                level:
                logger:

      # Frame heartbeat bodies carry the fleet telemetry the Frames dashboard reads.
      - match:
          selector: '{job="backend"} |= "log - " |= "serial_number"'
          stages:
            - regex:
                expression: 'log - (?:b'')?(?P<payload>\{.*\})''?$'
            - json:
                source: payload
                expressions:
                  serial_number:
                  version:
                  os_sha:
                  app_sha:
                  kernel:
            # version = release semver; os_sha = shareframe-hardware commit;
            # app_sha = shareframe-board commit. All low-cardinality per release.
            - labels:
                serial_number:
                version:
                os_sha:
                app_sha:
                kernel:
      - match:
          selector: '{job="grafana"}'
          stages:
            - replace:
                expression: 'authToken=(\w+)'
                replace: 'REDACTED'
            - logfmt:
                mapping:
                  level:
                  logger:
            - labels:
                level:
                logger:
