server:
  http_listen_port: 9080

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # App containers log to stdout and to logs_volume; stdout is the ingested copy.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      # grafana stdout repeats the file stream, unredacted session token included
      - source_labels: ["container"]
        regex: "grafana"
        action: drop
      - source_labels: ["container"]
        regex: ".*"
        target_label: job
        replacement: docker
      - source_labels: ["container"]
        regex: "(backend|websockets|celery|celery-beat)"
        target_label: job
        replacement: backend
    pipeline_stages:
      - match:
          selector: '{job="backend"}'
          stages:
            - regex:
                expression: '^(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d+) \[(?P<level>\w+)\] (?P<logger>\S+) - (?P<func>\S+) - (?P<message>.*)$'
            - labels:
                level:
                logger:

      # Frame heartbeat bodies carry the fleet telemetry the Frames dashboard reads.
      - match:
          selector: '{job="backend"} |= "log - b" |= "serial_number"'
          stages:
            - regex:
                expression: "log - b'(?P<payload>\\{.*\\})'$"
            - json:
                source: payload
                expressions:
                  serial_number:
                  fw_version:
            - labels:
                serial_number:
                fw_version:

  # Written by daphne itself, never to stdout.
  - job_name: backend-daphne-access
    static_configs:
      - targets: [localhost]
        labels:
          job: backend
          logtype: access
          __path__: /logs/backend-daphne-access.log

  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          logtype: access
          __path__: /logs/nginx-json-access.log
    pipeline_stages:
      - json:
          expressions:
            status: status
            request_method: request_method
            request_uri: request_uri
            request_time: request_time
            http_host: http_host
            server_name: server_name
            country: geoip_country_code
      # Access lines carry no level; Grafana shows them as "unknown".
      - template:
          source: level
          template: '{{ if hasPrefix "5" .status }}error{{ else if hasPrefix "4" .status }}warn{{ else }}info{{ end }}'
      - template:
          source: country
          template: '{{ if .country }}{{ .country }}{{ else }}unknown{{ end }}'
      # Unknown hosts collapse into one label, else any Host header mints a stream.
      - template:
          source: http_host
          template: '{{ if regexMatch "^([a-z0-9-]+\\.)*shareframe\\.de(:[0-9]+)?$|^([a-z0-9-]+\\.)?localhost(:[0-9]+)?$|^[0-9.]+(:[0-9]+)?$" .http_host }}{{ .http_host }}{{ else }}other{{ end }}'
      - labels:
          status:
          request_method:
          http_host:
          server_name:
          level:
          country:

  - job_name: nginx-error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          logtype: error
          __path__: /logs/nginx-error.log
    pipeline_stages:
      - regex:
          expression: '^\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2} \[(?P<level>\w+)\]'
      - regex:
          expression: 'server: (?P<server_name>[^,]+)'
      - template:
          source: level
          template: '{{ if .level }}{{ .level }}{{ else }}error{{ end }}'
      - labels:
          level:
          server_name:

  # Login events feed the security alerts.
  - job_name: grafana
    static_configs:
      - targets: [localhost]
        labels:
          job: grafana
          __path__: /grafana-logs/grafana.log
    pipeline_stages:
      # The login line carries the new session token; it must not reach Loki.
      - replace:
          expression: 'authToken=(\w+)'
          replace: 'REDACTED'
      - logfmt:
          mapping:
            level:
            logger:
      - labels:
          level:
          logger:
