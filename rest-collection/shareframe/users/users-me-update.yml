info:
  name: users-me-update
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{http_domain}}/api/auth/users/me/"
  headers:
    - name: X-CSRFToken
      value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
          "username": "<new-username>"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
