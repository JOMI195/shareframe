info:
  name: users-me-delete
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{http_domain}}/api/auth/users/me/"
  headers:
    - name: X-CSRFToken
      value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
          "password": "{{backend_admin_password}}",
          "anonymize": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
