info:
  name: unregister-user
  type: http
  seq: 4

http:
  method: POST
  url: "{{http_domain}}/api/frames/unregister-user/"
  headers:
    - name: X-CSRFToken
      value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
          "public_serial_number": "{{frame_public_serial_number}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
