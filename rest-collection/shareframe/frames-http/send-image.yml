info:
  name: send-image
  type: http
  seq: 5

http:
  method: POST
  url: "{{http_domain}}/api/frames/send-image/"
  headers:
    - name: X-CSRFToken
      value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
          "reciever_username": "{{seed_user_bob_username}}",
          "image_id": {{seed_image_id_for_send}},
          "expiry_unix_timestamp": {{seed_expiry_unix_timestamp}}
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Defaults target the seeded dev/local users (`seed_alice` -> `seed_bob`).
  Run auth/jwt-create with `seed_user_alice_email` / `seed_user_alice_password`
  first, then use the sender's own image id. `seed_image_id_for_send` defaults
  to 1 for fresh databases.
