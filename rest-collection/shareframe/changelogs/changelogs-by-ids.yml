info:
  name: changelogs-by-ids
  type: http
  seq: 2

http:
  method: POST
  url: "{{http_domain}}/api/changelogs/by-ids/"
  headers:
    - name: X-CSRFToken
      value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
          "ids": [1, 2]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
