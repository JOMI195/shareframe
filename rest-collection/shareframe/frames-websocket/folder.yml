docs: |-
  # Frame traffic

  Two ways to act like a real frame. Full guide: README.md in the collection root.

  ## Prerequisites

  - `npm install` in the collection root (pulls `ws`)
  - collection setting **Developer Mode** enabled (needed for `require()`)
  - use seeded env defaults (`frame_ed25519_private_key`, `frame_public_serial_number`)
    or override with your own frame identity
  - target backend must have a matching provisioned frame with user + `is_active=True`
    (seeded automatically in dev/local by `seed_dev_data`) or the WS handshake closes with 4001

  ## frame-session — send messages by hand

  1. run `frames-http/frame-auth-token/obtain` (signs itself, stores `frame_access_token`)
  2. **Connect** here, pick a message tab, send it

  `keepAliveInterval` 30000 ms mirrors the board's protocol ping.
  `config` and `heartbeat` are legacy Python-board messages; the C++ board sends that
  data over the HTTP heartbeat instead.

  ## simulate-frame — autonomous session

  Runs a whole frame lifecycle in its pre-request script: token fetch, WS connect,
  `check_missing_images` on open, periodic ping / HTTP heartbeat / expiry check,
  picture + clear tracking, reconnect with backoff and token refresh.

  Cadence env vars (`0` = off): `sim_duration_secs` (120), `sim_ping_secs` (30),
  `sim_heartbeat_secs` (300), `sim_heartbeat_at_start` (true), `sim_expiry_secs` (900), plus `sim_frame_version`,
  `sim_local_ip`, and `sim_initial_sent_image_ids` (JSON array). Defaults are the
  board's real intervals — compress them for short runs.

  Bruno blocks until the session ends, so keep `sim_duration_secs` short here.
  Long runs: `node scripts/run-sim.js --seed <b64> --duration 3600`.
