info:
  name: set-email
  type: http
  seq: 11

http:
  method: POST
  url: "{{http_domain}}/api/auth/users/set_username/"
  headers:
    - name: X-CSRFToken
      value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
          "new_email": "<new-email>",
          "current_password": "{{backend_admin_password}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
