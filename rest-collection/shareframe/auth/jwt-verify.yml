info:
  name: jwt-verify
  type: http
  seq: 5

http:
  method: POST
  url: "{{http_domain}}/api/auth/jwt/verify/"
  body:
    type: json
    data: |-
      {
          "token": "{{access_token}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Checks the access token captured into access_token by jwt-create / jwt-refresh.
  The API itself reads the token from the sf_access cookie, so this endpoint is only
  a debugging aid.
