info:
  name: set-password
  type: http
  seq: 8

http:
  method: POST
  url: "{{http_domain}}/api/auth/users/set_password/"
  headers:
    - name: X-CSRFToken
      value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
          "new_password": "<new-password>",
          "re_new_password": "<new-password>",
          "current_password": "{{backend_admin_password}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
