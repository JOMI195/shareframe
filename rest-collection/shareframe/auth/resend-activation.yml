info:
  name: resend-activation
  type: http
  seq: 7

http:
  method: POST
  url: "{{http_domain}}/api/auth/users/resend_activation/"
  headers:
    - name: X-CSRFToken
      value: "{{csrf_token}}"
  body:
    type: json
    data: |-
      {
          "email": "{{backend_admin_email}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
