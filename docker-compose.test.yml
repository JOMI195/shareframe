# Shared test stack: the Playwright e2e run and the backend pytest run both use it.
# Playwright starts everything (tests/support/e2e/stack.ts) and destroys it with
# `down -v`; pytest needs only backend_db and creates its own test_<DB_NAME> beside
# the app database. The database lives in tmpfs, so every run starts from the seed
# data and nothing survives. Ports are offset from the dev stack so both can run at
# the same time.
services:
  backend:
    container_name: backend-test
    build:
      context: ./backend
      dockerfile: ./Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend/:/app/backend
      - ./seed-data:/app/seed-data:ro
    ports:
      - 8100:8000
    env_file:
      - ./.env.test
    depends_on:
      backend_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # The slim image has no curl; migrations and seeding run before the server binds.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/csrf/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks:
      - backend_network

  # Login mails and changelog notifications are queued with .delay().
  celery:
    container_name: celery-test
    build:
      context: ./backend
      dockerfile: ./Dockerfile.dev
    command: celery -A config worker --loglevel=info -n worker1
    entrypoint: []
    volumes:
      - ./backend/:/app/backend
      - ./seed-data:/app/seed-data:ro
    env_file:
      - ./.env.test
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend_network

  backend_db:
    container_name: backend_db-test
    image: postgres:15
    env_file:
      - ./.env.test
    # Published for the backend pytest run, which executes on the host.
    ports:
      - 127.0.0.1:5433:5432
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - backend_network

  # Account deletion and the account mails go through SMTP, and a refused
  # connection turns into a 500 that rolls the whole request back. The API is
  # published for the e2e specs that follow a link from a mail.
  mailpit:
    container_name: mailpit-test
    image: axllent/mailpit:v1.32
    ports:
      - 127.0.0.1:8125:8025
    networks:
      - backend_network

  redis:
    container_name: redis-test
    image: redis:8.2-alpine
    command: redis-server --save "" --appendonly no --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge
