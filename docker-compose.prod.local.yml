x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  backend: &backend
    logging: *default-logging
    container_name: backend
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --log-level info --access-logfile - --error-logfile -
    volumes:
      - static_volume:/home/app/backend/staticfiles
      - media_volume:/home/app/backend/mediafiles
      - logs_volume:/home/app/backend/logs
    expose:
      - 8000
    env_file:
      - ./.env.prod.local
    depends_on:
      backend_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
      - backend_db_network
      - redis_network

  websockets:
    logging: *default-logging
    container_name: websockets
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    command: daphne --proxy-headers -b 0.0.0.0 -p 9000 -v 3 config.asgi:application --access-log /home/app/backend/logs/backend-daphne-access.log --websocket-max-message-size 16777216 --websocket-max-frame-size 16777216
    entrypoint: []
    volumes:
      - media_volume:/home/app/backend/mediafiles
      - logs_volume:/home/app/backend/logs
    expose:
      - 9000
    env_file:
      - ./.env.prod.local
    depends_on:
      backend_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
      - backend_db_network
      - redis_network

  backend_db:
    logging: *default-logging
    container_name: backend_db
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ./.env.prod.local
    volumes:
      - backend_db_data:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_db_network

  redis:
    logging: *default-logging
    container_name: redis
    image: redis:6.2-alpine
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1 --loglevel notice --maxmemory 512mb --maxmemory-policy allkeys-lru
    expose:
      - 6379
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - redis_network

  celery:
    <<: *backend
    container_name: celery
    restart: unless-stopped
    command: celery -A config worker --loglevel=info -n worker1
    depends_on:
      redis:
        condition: service_healthy
      backend_db:
        condition: service_healthy
      backend:
        condition: service_started
    entrypoint: []
    ports: []
    networks:
      - backend_network
      - backend_db_network
      - redis_network

  celery-beat:
    <<: *backend
    container_name: celery-beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy
      backend_db:
        condition: service_healthy
      backend:
        condition: service_started
    entrypoint: []
    ports: []
    networks:
      - backend_network
      - backend_db_network
      - redis_network

  nginx:
    logging: *default-logging
    container_name: nginx
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod.local
      args:
        VITE_APP_BUILD_VERSION: ${VITE_APP_BUILD_VERSION}
    volumes:
      - static_volume:/home/app/backend/staticfiles
      - media_volume:/home/app/backend/mediafiles
      - logs_volume:/home/app/backend/logs
    depends_on:
      backend:
        condition: service_started
      websockets:
        condition: service_started
    ports:
      - 80:80
    env_file:
      - ./.env.prod.local
    networks:
      - frontend_network
      - backend_network

  mailhog:
    logging: *default-logging
    container_name: mailhog
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend_network

  # ---- Monitoring ----
  prometheus:
    logging: *default-logging
    container_name: prometheus
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_network
      - backend_network

  grafana:
    logging: *default-logging
    container_name: grafana
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: http://monitoring.localhost
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # unauthenticated endpoint, nothing scrapes it
      GF_METRICS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_LOG_MODE: "console file"
      # login alerts read the auth logger's debug lines
      GF_LOG_FILTERS: "auth:debug"
      GF_LOG_FILE_MAX_SIZE_SHIFT: "24"
      GF_LOG_FILE_MAX_DAYS: "7"
      # read by the Grafana alerting contact point
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL}
      # MailHog: no auth, no TLS. Prod uses MandatoryStartTLS.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${EMAIL_HOST}:${EMAIL_PORT}"
      GF_SMTP_USER: ""
      GF_SMTP_PASSWORD: ""
      GF_SMTP_FROM_ADDRESS: ${EMAIL_HOST_USER}
      GF_SMTP_FROM_NAME: ShareFrame Monitoring
      GF_SMTP_SKIP_VERIFY: "true"
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
      - grafana_logs:/var/log/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring_network
      - frontend_network
      - backend_network

  node-exporter:
    logging: *default-logging
    container_name: node-exporter
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --no-collector.diskstats
    pid: host
    volumes:
      - /:/host:ro
    networks:
      - monitoring_network

  loki:
    logging: *default-logging
    container_name: loki
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring_network

  promtail:
    logging: *default-logging
    container_name: promtail
    image: grafana/promtail:3.6.11
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - promtail_positions:/positions
      - logs_volume:/logs:ro
      - grafana_logs:/grafana-logs:ro
    depends_on:
      - loki
    networks:
      - monitoring_network

volumes:
  backend_db_data:
  static_volume:
  media_volume:
  logs_volume:
  redis_data:
  prometheus_data:
  grafana_data:
  grafana_logs:
  loki_data:
  promtail_positions:


networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
  backend_db_network:
    driver: bridge
  redis_network:
    driver: bridge
  monitoring_network:
    driver: bridge
