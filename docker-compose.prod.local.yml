x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  backend:
    logging: *default-logging
    container_name: backend
    restart: unless-stopped
    # Shared by websockets and the workers, so one build serves all four.
    image: shareframe-backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --log-level info --access-logfile - --error-logfile -
    healthcheck:
      # Host must be in ALLOWED_HOSTS, and prod has no localhost there.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:8000/api/health/', headers={'Host': 'backend'}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # entrypoint runs the migrations first
      start_period: 120s
    volumes:
      - static_volume:/home/app/backend/staticfiles
      - media_volume:/home/app/backend/mediafiles
      - logs_volume:/home/app/backend/logs
      - ./seed-data:/home/app/seed-data:ro
    expose:
      - 8000
    env_file:
      - ./.env.prod.local
    depends_on:
      backend_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
      - backend_db_network
      - redis_network

  websockets:
    logging: *default-logging
    container_name: websockets
    restart: unless-stopped
    image: shareframe-backend
    pull_policy: never
    command: daphne --proxy-headers -b 0.0.0.0 -p 9000 -v 3 config.asgi:application --access-log /home/app/backend/logs/backend-daphne-access.log --websocket-max-message-size 16777216 --websocket-max-frame-size 16777216
    entrypoint: []
    volumes:
      - media_volume:/home/app/backend/mediafiles
      - logs_volume:/home/app/backend/logs
    expose:
      - 9000
    env_file:
      - ./.env.prod.local
    # One DB thread serves all frames; gunicorn stays at 0 so its many threads don't exhaust max_connections.
    environment:
      DB_CONN_MAX_AGE: "60"
    depends_on:
      backend_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
      - backend_db_network
      - redis_network

  backend_db:
    logging: *default-logging
    container_name: backend_db
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ./.env.prod.local
    volumes:
      - backend_db_data:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_db_network

  redis:
    logging: *default-logging
    container_name: redis
    image: redis:8.2-alpine
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1 --loglevel notice --maxmemory 512mb --maxmemory-policy allkeys-lru
    expose:
      - 6379
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - redis_network

  celery:
    logging: *default-logging
    container_name: celery
    restart: unless-stopped
    image: shareframe-backend
    pull_policy: never
    volumes:
      - static_volume:/home/app/backend/staticfiles
      - media_volume:/home/app/backend/mediafiles
      - logs_volume:/home/app/backend/logs
      - ./seed-data:/home/app/seed-data:ro
    env_file:
      - ./.env.prod.local
    command: celery -A config worker --loglevel=info -n worker1
    depends_on:
      redis:
        condition: service_healthy
      backend_db:
        condition: service_healthy
      backend:
        condition: service_started
    entrypoint: []
    ports: []
    networks:
      - backend_network
      - backend_db_network
      - redis_network

  celery-beat:
    logging: *default-logging
    container_name: celery-beat
    restart: unless-stopped
    image: shareframe-backend
    pull_policy: never
    volumes:
      - static_volume:/home/app/backend/staticfiles
      - media_volume:/home/app/backend/mediafiles
      - logs_volume:/home/app/backend/logs
      - ./seed-data:/home/app/seed-data:ro
    env_file:
      - ./.env.prod.local
    command: celery -A config beat --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy
      backend_db:
        condition: service_healthy
      backend:
        condition: service_started
    entrypoint: []
    ports: []
    networks:
      - backend_network
      - backend_db_network
      - redis_network

  frontend:
    logging: *default-logging
    container_name: frontend
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
      args:
        VITE_APP_BUILD_VERSION: ${VITE_APP_BUILD_VERSION}
        FORCE_RELOAD: ${FORCE_RELOAD:-false}
      secrets:
        - frontend_env
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_network

  # Gateway. No depends_on, so app deploys never recreate it.
  nginx:
    logging: *default-logging
    container_name: nginx
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./nginx/Dockerfile.prod
    volumes:
      - ./nginx/local:/etc/nginx/site:ro
      - ./data/maintenance:/etc/nginx/maintenance:ro
      - static_volume:/home/app/backend/staticfiles
      - media_volume:/home/app/backend/mediafiles
      - logs_volume:/home/app/backend/logs
    ports:
      - "0.0.0.0:80:80"
      - "[::]:80:80"
    networks:
      - frontend_network
      - backend_network

  mailhog:
    logging: *default-logging
    container_name: mailhog
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend_network

  backup:
    logging: *default-logging
    container_name: backup
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./backup/Dockerfile.prod
    # restic unlock only clears locks of dead PIDs on its own hostname
    hostname: backup
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?}
      RESTIC_HOST: shareframe
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:?}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:?}
      RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY:?}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:?}
      BACKUP_CHECK_SCHEDULE: ${BACKUP_CHECK_SCHEDULE:?}
      BACKUP_CHECK_SUBSET: ${BACKUP_CHECK_SUBSET:?}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      PGHOST: backend_db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "pgrep", "-x", "supercronic"]
      interval: 60s
      timeout: 5s
      # BACKUP_ON_START runs before the scheduler starts
      start_period: 10m
    # the base image declares a data VOLUME, this keeps it from piling up
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - backup_repo:/repo
      - backup_metrics:/metrics
      - media_volume:/data/media:ro
      - logs_volume:/data/logs:ro
    depends_on:
      backend_db:
        condition: service_healthy
    networks:
      - backend_db_network

  # ---- Monitoring ----
  prometheus:
    logging: *default-logging
    container_name: prometheus
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9090/-/ready" ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - monitoring_network
      - backend_network

  grafana:
    logging: *default-logging
    container_name: grafana
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: http://monitoring.localhost
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shareframe-overview.json
      # unauthenticated endpoint, nothing scrapes it
      GF_METRICS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_LOG_MODE: "console file"
      # login alerts read the auth logger's debug lines
      GF_LOG_FILTERS: "auth:debug"
      GF_LOG_FILE_MAX_SIZE_SHIFT: "24"
      GF_LOG_FILE_MAX_DAYS: "7"
      # read by the Grafana alerting contact point
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL}
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL}
      # MailHog: no auth, no TLS. Prod uses MandatoryStartTLS.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${EMAIL_HOST}:${EMAIL_PORT}"
      GF_SMTP_USER: ""
      GF_SMTP_PASSWORD: ""
      GF_SMTP_FROM_ADDRESS: ${EMAIL_HOST_USER}
      GF_SMTP_FROM_NAME: ShareFrame Monitoring
      GF_SMTP_SKIP_VERIFY: "true"
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
      - grafana_logs:/var/log/grafana
    depends_on:
      prometheus:
        condition: service_healthy
        restart: true
      loki:
        condition: service_started
    networks:
      - monitoring_network
      - frontend_network
      - backend_network

  node-exporter:
    logging: *default-logging
    container_name: node-exporter
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      # netdev/netclass only ever see this container's namespace; nothing reads
      # them or the nfs ones, and netclass churns a series set per veth
      - --no-collector.netdev
      - --no-collector.netclass
      - --no-collector.nfs
      - --no-collector.nfsd
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /:/host:ro
      - backup_metrics:/textfile:ro
    networks:
      - monitoring_network

  telegraf:
    logging: *default-logging
    container_name: telegraf
    image: telegraf:1.35-alpine
    restart: unless-stopped
    # the image entrypoint drops to the telegraf user, which cannot read the socket
    user: "0:0"
    entrypoint: ["telegraf"]
    volumes:
      - ./monitoring/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - 9273
    networks:
      - monitoring_network

  loki:
    logging: *default-logging
    container_name: loki
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring_network

  promtail:
    logging: *default-logging
    container_name: promtail
    image: grafana/promtail:3.6.11
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - promtail_positions:/positions
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - logs_volume:/logs:ro
      - grafana_logs:/grafana-logs:ro
    depends_on:
      - loki
    networks:
      - monitoring_network

secrets:
  frontend_env:
    file: ./.env.prod.local

volumes:
  backend_db_data:
  static_volume:
  media_volume:
  logs_volume:
  redis_data:
  prometheus_data:
  grafana_data:
  grafana_logs:
  loki_data:
  promtail_positions:
  backup_repo:
  backup_metrics:


networks:
  frontend_network:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd4e:9a2c:71b3:2::/64
  backend_network:
    driver: bridge
  # postgres and redis never need the internet
  backend_db_network:
    driver: bridge
    internal: true
  redis_network:
    driver: bridge
    internal: true
  monitoring_network:
    driver: bridge
