x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  backend: &backend
    logging: *default-logging
    container_name: backend-dev
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: ./Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend/:/app/backend
    ports:
      - 8000:8000
    env_file:
      - ./.env.dev
    depends_on:
      backend_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
      - backend_db_network
      - redis_network

  websockets:
    logging: *default-logging
    container_name: websockets-dev
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: ./Dockerfile.dev
    command: daphne --proxy-headers -b 0.0.0.0 -p 9000 -v 3 config.asgi:application --websocket-max-message-size 16777216 --websocket-max-frame-size 16777216
    entrypoint: []
    volumes:
      - ./backend/:/app/backend
    ports:
      - 9000:9000
    env_file:
      - ./.env.dev
    depends_on:
      backend_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
      - backend_db_network
      - redis_network

  backend_db:
    logging: *default-logging
    container_name: backend_db-dev
    image: postgres:15
    restart: unless-stopped
    ports:
      - 5432:5432
    volumes:
      - backend_db_data:/var/lib/postgresql/data/
    env_file:
      - ./.env.dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_db_network

  redis:
    logging: *default-logging
    container_name: redis-dev
    image: redis:6.2-alpine
    restart: unless-stopped
    command: redis-server  --appendonly yes  --appendfsync everysec  --save 60 1  --loglevel notice  --maxmemory 512mb  --maxmemory-policy allkeys-lru
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - redis_network

  celery:
    container_name: celery-dev
    <<: *backend
    command: celery -A config worker --loglevel=info -n worker1
    depends_on:
      - redis
    entrypoint: []
    ports: []
    networks:
      - backend_network
      - backend_db_network
      - redis_network

  celery-beat:
    container_name: celery-beat-dev
    <<: *backend
    command: celery -A config beat
    depends_on:
      - redis
    entrypoint: []
    ports: []
    networks:
      - backend_network
      - backend_db_network
      - redis_network

  mailhog:
    logging: *default-logging
    container_name: mailhog-dev
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend_network

  frontend:
    logging: *default-logging
    container_name: frontend-dev
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_APP_BUILD_VERSION: ${VITE_APP_BUILD_VERSION}
    volumes:
      - ./frontend:/app/frontend
      - node_modules:/app/frontend/node_modules
    env_file:
      - ./.env.dev
    ports:
      - "3000:3000"
    networks:
      - frontend_network

  # ---- Monitoring ----
  prometheus:
    logging: *default-logging
    container_name: prometheus-dev
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_network
      - backend_network

  grafana:
    logging: *default-logging
    container_name: grafana-dev
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # unauthenticated endpoint, nothing scrapes it
      GF_METRICS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      # login alerts read the auth logger's debug lines
      GF_LOG_FILTERS: "auth:debug"
      # read by the Grafana alerting contact point
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL}
      # MailHog: no auth, no TLS. Prod uses MandatoryStartTLS.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${EMAIL_HOST}:${EMAIL_PORT}"
      GF_SMTP_USER: ""
      GF_SMTP_PASSWORD: ""
      GF_SMTP_FROM_ADDRESS: ${EMAIL_HOST_USER}
      GF_SMTP_FROM_NAME: ShareFrame Monitoring
      GF_SMTP_SKIP_VERIFY: "true"
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring_network
      - backend_network

  node-exporter:
    logging: *default-logging
    container_name: node-exporter-dev
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --no-collector.diskstats
    pid: host
    volumes:
      - /:/host:ro
    networks:
      - monitoring_network

  telegraf:
    logging: *default-logging
    container_name: telegraf-dev
    image: telegraf:1.35-alpine
    restart: unless-stopped
    # the image entrypoint drops to the telegraf user, which cannot read the socket
    user: "0:0"
    entrypoint: ["telegraf"]
    volumes:
      - ./monitoring/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - 9273
    networks:
      - monitoring_network

  loki:
    logging: *default-logging
    container_name: loki-dev
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring_network

  promtail:
    logging: *default-logging
    container_name: promtail-dev
    image: grafana/promtail:3.6.11
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.dev.yml:/etc/promtail/promtail-config.yml:ro
      - promtail_positions:/positions
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitoring_network

volumes:
  backend_db_data:
  node_modules: {}
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
  backend_db_network:
    driver: bridge
  redis_network:
    driver: bridge
  monitoring_network:
    driver: bridge