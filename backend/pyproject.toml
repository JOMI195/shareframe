[project]
name = "shareframe-backend"
version = "0"
requires-python = ">=3.13"
dependencies = [
    "Django>=6.0.8,<6.1",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "djoser>=2.3.4",
    "drf-spectacular>=0.30.0",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-cors-headers>=4.9.0",
    "django-otp>=1.7.2",
    "django-redis>=7.0.0",
    "django-prometheus>=2.5.0",
    "celery[redis]>=5.6.3",
    "redis>=6.4.0,<6.5",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.12",
    "pillow>=12.3.0",
    "cryptography>=50.0.1",
    "Levenshtein>=0.27.4",
    "semver>=3.0.4",
]

# Django capped below 6.1: django-celery-beat and django-prometheus both
# require Django<6.1. redis capped below 6.5: kombu's supported client range.

# Floor transitive packages flagged by Dependabot to their patched versions.
[tool.uv]
package = false
constraint-dependencies = [
    "urllib3>=2.7.0",
    "requests>=2.33.0",
    "idna>=3.19",
    "h2>=4.3.0",
    "sqlparse>=0.6.0",
    "Markdown>=3.10.3",
    "PyJWT>=2.12.0",
    "pyasn1>=0.6.4",
    "pyOpenSSL>=26.4.0",
    "twisted>=26.4.0",
]
