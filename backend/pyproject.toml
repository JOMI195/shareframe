[project]
name = "shareframe-backend"
version = "0"
requires-python = ">=3.13"
dependencies = [
    "Django>=6.0.8,<6.1",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "djoser>=2.3.4",
    "drf-spectacular>=0.30.0",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-cors-headers>=4.9.0",
    "django-otp>=1.7.2",
    "django-redis>=7.0.0",
    "django-prometheus>=2.5.0",
    "celery[redis]>=5.6.3",
    "redis>=6.4.0,<6.5",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.12",
    "pillow>=12.3.0",
    "cryptography>=50.0.1",
    "Levenshtein>=0.27.4",
    "semver>=3.0.4",
]

# Django capped below 6.1: django-celery-beat and django-prometheus both
# require Django<6.1. redis capped below 6.5: kombu's supported client range.

# Floor transitive packages flagged by Dependabot to their patched versions.
[tool.uv]
package = false
constraint-dependencies = [
    "urllib3>=2.7.0",
    "requests>=2.33.0",
    "idna>=3.19",
    "h2>=4.3.0",
    "sqlparse>=0.6.0",
    "Markdown>=3.10.3",
    "PyJWT>=2.12.0",
    "pyasn1>=0.6.4",
    "pyOpenSSL>=26.4.0",
    "twisted>=26.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "pytest-dotenv>=0.5.2",
    "factory-boy>=3.3",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
# The committed, all-fake test env. Loaded before Django settings are imported.
env_files = ["../.env.test"]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# --ds beats the DJANGO_SETTINGS_MODULE that .env.test sets for the containers.
addopts = "--ds=config.settings_test --strict-markers --reuse-db"
markers = [
    "throttled: run with the real DRF throttle classes restored",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/management/commands/*",
    "conftest.py",
    "tests/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
    "config/celery.py",
    "config/celeryconfig.py",
    "config/settings*.py",
    "*/admin.py",
    "*/apps.py",
    # A vendored copy of django-request-logging, disabled under test.
    "utils/request_logging/middleware.py",
]

[tool.coverage.report]
# Raise it, never lower it.
fail_under = 89
skip_covered = true
