{% extends "base/base_email.html" %}

{% block title %}Kontaktformular{% endblock %}

{% block content %}
<h1 style="font-size: 24px; line-height: 1.5; font-family: Inter, Roboto, Arial, sans-serif;">Kontaktformular</h1>
<table cellpadding="8" cellspacing="0" border="0" style="font-size: 15px; line-height: 1.5; font-family: Inter, Roboto, Arial, sans-serif; margin: 16px 0;">
    <tr>
        <td style="color: #666666;"><strong>Von:</strong></td>
        <td>{{ name }}</td>
    </tr>
    <tr>
        <td style="color: #666666;"><strong>E-Mail:</strong></td>
        <td>{{ email }}</td>
    </tr>
    <tr>
        <td style="color: #666666;"><strong>Betreff:</strong></td>
        <td>{{ contact_subject }}</td>
    </tr>
</table>
<p style="font-size: 16px; line-height: 1.5; font-family: Inter, Roboto, Arial, sans-serif;">
    {{ message|linebreaksbr }}
</p>
{% endblock %}
